name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q blast scripts examples tests

      - name: Verify repository and submission invariants
        run: python scripts/verify_repository.py

      - name: Run unit tests
        run: pytest

      - name: Run minimal example
        run: python examples/minimal_example.py
