<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Endpoint assignment versus BLAST attribution</title>
  <desc id="desc">Comparison of conventional endpoint assignment at delay zero and BLAST bounded-latency attribution with separate attribution and evidence-availability times.</desc>
  <style>
    .title{font:700 28px Arial,Helvetica,sans-serif;fill:#111827}
    .panel-title{font:700 25px Arial,Helvetica,sans-serif;fill:#111827}
    .body{font:20px Arial,Helvetica,sans-serif;fill:#111827}
    .small{font:17px Arial,Helvetica,sans-serif;fill:#374151}
    .panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
    .timeline{stroke:#374151;stroke-width:3}
    .guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
    .arrow{stroke:#374151;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="600" y="40" text-anchor="middle" class="title">Endpoint assignment vs. BLAST attribution</text>

  <rect x="40" y="72" width="520" height="430" rx="18" class="panel"/>
  <text x="300" y="112" text-anchor="middle" class="panel-title">(a) Endpoint assignment, d = 0</text>

  <rect x="115" y="160" width="250" height="74" rx="12" class="blue"/>
  <text x="240" y="190" text-anchor="middle" class="body">Causal window</text>
  <text x="240" y="216" text-anchor="middle" class="small">x[e−W+1 … e]</text>
  <line x1="365" y1="197" x2="390" y2="267" class="arrow"/>

  <line x1="105" y1="300" x2="505" y2="300" class="timeline arrow"/>
  <line x1="390" y1="245" x2="390" y2="355" class="guide"/>
  <circle cx="390" cy="300" r="11" fill="#2563eb"/>
  <text x="390" y="382" text-anchor="middle" class="body">endpoint e</text>

  <rect x="145" y="408" width="310" height="58" rx="12" class="blue"/>
  <text x="300" y="434" text-anchor="middle" class="small">q(e) is assigned at e</text>
  <text x="300" y="456" text-anchor="middle" class="small">and is available at e</text>

  <rect x="640" y="72" width="520" height="430" rx="18" class="panel"/>
  <text x="900" y="112" text-anchor="middle" class="panel-title">(b) BLAST attribution, d &gt; 0</text>

  <rect x="750" y="160" width="270" height="74" rx="12" class="blue"/>
  <text x="885" y="190" text-anchor="middle" class="body">Evidence window</text>
  <text x="885" y="216" text-anchor="middle" class="small">x[t+d−W+1 … t+d]</text>
  <line x1="995" y1="234" x2="1015" y2="267" class="arrow"/>

  <line x1="705" y1="300" x2="1105" y2="300" class="timeline arrow"/>
  <line x1="820" y1="245" x2="820" y2="355" class="guide"/>
  <line x1="1015" y1="245" x2="1015" y2="355" class="guide"/>
  <circle cx="820" cy="300" r="11" fill="#ea580c"/>
  <circle cx="1015" cy="300" r="11" fill="#2563eb"/>

  <line x1="835" y1="340" x2="1000" y2="340" class="arrow"/>
  <text x="917" y="329" text-anchor="middle" class="small">evidence delay d</text>

  <text x="820" y="382" text-anchor="middle" class="body">attribution t</text>
  <text x="1015" y="382" text-anchor="middle" class="body">availability t+d</text>

  <rect x="705" y="408" width="390" height="58" rx="12" class="orange"/>
  <text x="900" y="434" text-anchor="middle" class="small">q(t+d) is assigned to event time t</text>
  <text x="900" y="456" text-anchor="middle" class="small">but evidence exists only at t+d</text>
</svg>
