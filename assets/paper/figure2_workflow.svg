<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="title desc">
  <title id="title">BLAST reproducible workflow</title>
  <desc id="desc">Three-stage workflow showing fixed causal scoring, bounded-latency attribution, and the frozen U237 development to M70 confirmation protocol.</desc>
  <style>
    .title{font:700 30px Arial,Helvetica,sans-serif;fill:#111827}
    .panel-title{font:700 27px Arial,Helvetica,sans-serif;fill:#111827}
    .body{font:20px Arial,Helvetica,sans-serif;fill:#111827}
    .small{font:17px Arial,Helvetica,sans-serif;fill:#374151}
    .panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
    .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
    .green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}
    .arrow{stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="720" y="42" text-anchor="middle" class="title">BLAST reproducible workflow</text>

  <rect x="35" y="82" width="400" height="400" rx="18" class="panel"/>
  <text x="235" y="124" text-anchor="middle" class="panel-title">A. Fixed causal scoring</text>
  <rect x="92" y="168" width="286" height="78" rx="12" class="blue"/>
  <text x="235" y="198" text-anchor="middle" class="body">Observed stream through e</text>
  <text x="235" y="225" text-anchor="middle" class="small">x[e−W+1 … e], W = 256</text>
  <line x1="235" y1="246" x2="235" y2="286" class="arrow"/>
  <rect x="92" y="286" width="286" height="78" rx="12" class="blue"/>
  <text x="235" y="316" text-anchor="middle" class="body">Endpoint score q(e)</text>
  <text x="235" y="343" text-anchor="middle" class="small">trailing sample std, ddof = 1</text>
  <text x="235" y="414" text-anchor="middle" class="small">Uses only observations available by e</text>
  <text x="235" y="440" text-anchor="middle" class="small">Detector and endpoint-score values stay fixed</text>

  <rect x="520" y="82" width="400" height="400" rx="18" class="panel"/>
  <text x="720" y="124" text-anchor="middle" class="panel-title">B. Bounded attribution</text>
  <rect x="577" y="176" width="286" height="70" rx="12" class="orange"/>
  <text x="720" y="218" text-anchor="middle" class="body">Assign q(e) to t = e − d</text>
  <line x1="720" y1="246" x2="720" y2="292" class="arrow"/>
  <rect x="577" y="292" width="286" height="70" rx="12" class="green"/>
  <text x="720" y="334" text-anchor="middle" class="body">Evidence remains available at e</text>
  <text x="720" y="414" text-anchor="middle" class="small">d = 0: conventional endpoint assignment</text>
  <text x="720" y="440" text-anchor="middle" class="small">d &gt; 0: retrospective temporal localization</text>

  <rect x="1005" y="82" width="400" height="400" rx="18" class="panel"/>
  <text x="1205" y="124" text-anchor="middle" class="panel-title">C. Frozen protocol</text>
  <rect x="1062" y="156" width="286" height="72" rx="12" class="blue"/>
  <text x="1205" y="185" text-anchor="middle" class="body">U237 development</text>
  <text x="1205" y="211" text-anchor="middle" class="small">D = {0, 32, 64, 96, 127}</text>
  <line x1="1205" y1="228" x2="1205" y2="267" class="arrow"/>
  <rect x="1062" y="267" width="286" height="78" rx="12" class="orange"/>
  <text x="1205" y="298" text-anchor="middle" class="body">Select smallest qualifying</text>
  <text x="1205" y="325" text-anchor="middle" class="small">low-latency candidate: d*=32</text>
  <line x1="1205" y1="345" x2="1205" y2="382" class="arrow"/>
  <rect x="1062" y="382" width="286" height="66" rx="12" class="green"/>
  <text x="1205" y="409" text-anchor="middle" class="body">M70 confirmation</text>
  <text x="1205" y="434" text-anchor="middle" class="small">frozen d*=32, no retuning</text>

  <line x1="435" y1="282" x2="520" y2="282" class="arrow"/>
  <line x1="920" y1="282" x2="1005" y2="282" class="arrow"/>
</svg>
