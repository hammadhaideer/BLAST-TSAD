[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-tsad"
version = "1.0.2"
description = "BLAST: Bounded-Latency Attribution of Streaming Time-Series Anomalies"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Hammad Ali Haider"},
  {name = "Panpan Zheng"},
]
keywords = [
  "time-series anomaly detection",
  "streaming anomaly detection",
  "causal scoring",
  "temporal localization",
  "bounded latency",
]
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
  "vus==0.0.6",
]

[project.urls]
Repository = "https://github.com/hammadhaideer/BLAST-TSAD"
Documentation = "https://github.com/hammadhaideer/BLAST-TSAD/tree/main/docs"
Results = "https://github.com/hammadhaideer/BLAST-TSAD/blob/main/docs/RESULTS.md"
Reproducibility = "https://github.com/hammadhaideer/BLAST-TSAD/blob/main/docs/REPRODUCIBILITY.md"

[tool.setuptools]
packages = ["blast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
